<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find the Animal Pairs</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-back: #2c3e50;
            --card-front: #ffffff;
            --accent: #3498db;
            --success: #27ae60;
            --fail: #e74c3c;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            background: var(--bg-color); 
            margin: 0; 
            padding: 10px;
            touch-action: manipulation; /* Prevents accidental zooming on taps */
        }

        h1 { font-size: 1.5rem; margin-bottom: 10px; }

        #message { 
            font-size: 1.2rem; 
            margin: 15px 0; 
            font-weight: bold; 
            min-height: 1.5em; 
        }

        /* Update the Grid Logic */
		.grid { 
			display: grid; 
			grid-template-columns: repeat(5, 1fr); /* Desktop */
			gap: 7px; 
			max-width: 500px; 
			margin: 0 auto; 
		}

		/* Update this specific Media Query for Phones */
		@media (max-width: 480px) {
			.grid { 
				grid-template-columns: repeat(3, 1fr); /* 3 columns makes cards smaller */
				max-width: 265px; /* Limits the overall width of the game area */
				gap: 7px;
			}
			
			.card {
				font-size: 1.8rem; /* Shrinks the emoji size slightly to fit smaller cards */
			}
		}

        .card {
            aspect-ratio: 3 / 4; 
			background: var(--card-back);
            cursor: pointer; 
            display: flex; 
            align-items: center;
            justify-content: center; 
            font-size: 2.5rem; 
            border-radius: 10px;
            color: transparent; 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            user-select: none;
        }

        .card.flipped, .card.reveal { 
            background: var(--card-front); 
            color: #000; 
            transform: rotateY(180deg); 
        }

        .card.matched { 
            background: var(--success); 
            color: white; 
            transform: rotateY(180deg); 
            cursor: default;
        }

        .controls { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 10px; 
            margin-top: 25px; 
        }

        button { 
            width: 80%;
            max-width: 200px;
            padding: 15px; 
            font-size: 1.1rem; 
            font-weight: bold;
            cursor: pointer; 
            border: none; 
            border-radius: 30px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-restart { background: var(--accent); color: white; }
        .btn-reveal { background: #e67e22; color: white; display: none; }

        /* Small tap animation */
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>Find the Animal Pairs</h1>
    <div id="message">Memorize the cards!</div>
    
    <div class="grid" id="grid"></div>

    <div class="controls">
        <button class="btn-restart" onclick="startGame()">New Game</button>
        <button id="revealBtn" class="btn-reveal" onclick="revealAll()">Reveal Pairs</button>
    </div>

    <script>
        const animals = ['🐄', '🐅', '🐱', '🐶', '🐒', '🐄', '🐅', '🐱', '🐶', '🐒'];
        let flippedCards = [];
        let matchedCount = 0;
        let canClick = false;

        function startGame() {
            const grid = document.getElementById('grid');
            const message = document.getElementById('message');
            const revealBtn = document.getElementById('revealBtn');
            
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canClick = false;
            revealBtn.style.display = "none";
            message.innerText = "Memorize the cards!";
            message.style.color = "#333";

            const shuffled = [...animals].sort(() => 0.5 - Math.random());

            shuffled.forEach((animal) => {
                const card = document.createElement('div');
                card.classList.add('card', 'flipped'); 
                card.dataset.animal = animal;
                card.innerText = animal;
                card.onclick = () => handleCardClick(card);
                grid.appendChild(card);
            });

            setTimeout(() => {
                document.querySelectorAll('.card').forEach(card => card.classList.remove('flipped'));
                message.innerText = "Go! Tap a pair.";
                canClick = true;
            }, 3000);
        }

        function handleCardClick(card) {
            if (!canClick || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                const [card1, card2] = flippedCards;

                if (card1.dataset.animal === card2.dataset.animal) {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount += 2;
                    flippedCards = [];

                    if (matchedCount === animals.length) {
                        document.getElementById('message').innerText = "🏆 WINNER!";
                        document.getElementById('message').style.color = "var(--success)";
                        canClick = false;
                    }
                } else {
                    document.getElementById('message').innerText = "❌ GAME OVER";
                    document.getElementById('message').style.color = "var(--fail)";
                    document.getElementById('revealBtn').style.display = "block";
                    canClick = false; 
                }
            }
        }

        function revealAll() {
            document.querySelectorAll('.card').forEach(card => card.classList.add('reveal'));
            document.getElementById('revealBtn').style.display = "none";
        }

        startGame();
    </script>
</body>
</html>
